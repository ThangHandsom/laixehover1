<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Gọi là tới - Hệ sinh thái</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              red: {
                50: "#fef2f2",
                100: "#fee2e2",
                200: "#fecaca",
                300: "#fca5a5",
                400: "#f87171",
                500: "#ef4444",
                600: "#dc2626",
                700: "#b91c1c",
                800: "#991b1b" /* Đỏ trầm chủ đạo */,
                900: "#7f1d1d",
              },
            },
          },
        },
      };
    </script>

    <style>
      .bg-map-pattern {
        background-image:
          linear-gradient(#999 1px, transparent 1px),
          linear-gradient(90deg, #999 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .marker-transition {
        transition:
          top 1.5s linear,
          left 1.5s linear;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gray-900 font-sans text-gray-800 m-0 p-0 flex justify-center items-center overflow-hidden"
  >
    <!-- ========================================== -->
    <!-- 0. PORTAL ROLE SELECTOR -->
    <!-- ========================================== -->
    <div
      id="app-portal"
      class="fixed inset-0 bg-gray-900 z-[100] flex flex-col items-center justify-center p-6"
    >
      <div
        class="w-24 h-24 bg-red-800 rounded-2xl flex items-center justify-center mb-8 shadow-lg shadow-red-900/50"
      >
        <i data-lucide="car" class="text-white w-12 h-12"></i>
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">
        Hệ sinh thái "Gọi là tới"
      </h1>
      <p class="text-gray-400 mb-10 text-center max-w-md">
        Vui lòng chọn vai trò để trải nghiệm ứng dụng mô phỏng.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 w-full max-w-2xl">
        <!-- Customer -->
        <button
          onclick="launchApp('customer')"
          class="flex-1 bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center gap-4 hover:scale-105 transition group cursor-pointer border-4 border-transparent hover:border-red-800"
        >
          <div
            class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center text-red-800 group-hover:bg-red-800 group-hover:text-white transition"
          >
            <i data-lucide="user" class="w-8 h-8"></i>
          </div>
          <div class="text-center">
            <h3 class="font-bold text-xl text-gray-800">Khách hàng</h3>
            <p class="text-sm text-gray-500 mt-2">
              Đặt xe, theo dõi, thanh toán
            </p>
          </div>
        </button>

        <!-- Driver -->
        <button
          onclick="launchApp('driver')"
          class="flex-1 bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center gap-4 hover:scale-105 transition group cursor-pointer border-4 border-transparent hover:border-blue-600"
        >
          <div
            class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition"
          >
            <i data-lucide="car" class="w-8 h-8"></i>
          </div>
          <div class="text-center">
            <h3 class="font-bold text-xl text-gray-800">Tài xế</h3>
            <p class="text-sm text-gray-500 mt-2">
              Nhận chuyến, điều hướng, thu nhập
            </p>
          </div>
        </button>

        <!-- Admin -->
        <button
          onclick="launchApp('admin')"
          class="flex-1 bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center gap-4 hover:scale-105 transition group cursor-pointer border-4 border-transparent hover:border-gray-800"
        >
          <div
            class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-gray-800 group-hover:bg-gray-800 group-hover:text-white transition"
          >
            <i data-lucide="layout-dashboard" class="w-8 h-8"></i>
          </div>
          <div class="text-center">
            <h3 class="font-bold text-xl text-gray-800">Admin Dashboard</h3>
            <p class="text-sm text-gray-500 mt-2">
              Quản lý hệ thống (Giao diện Web)
            </p>
          </div>
        </button>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- MOBILE DEVICE FRAME (For Customer & Driver) -->
    <!-- ========================================== -->
    <div
      id="mobile-frame"
      class="hidden w-full max-w-[400px] h-[100dvh] max-h-[850px] bg-white relative sm:rounded-[2rem] shadow-2xl overflow-hidden flex flex-col sm:border-8 border-gray-800"
    >
      <!-- HEADER -->
      <header
        id="mobile-header"
        class="bg-red-800 text-white p-4 flex items-center justify-between sticky top-0 z-50 shadow-md"
      >
        <button
          id="header-back"
          class="p-1 hover:bg-white/20 rounded-full transition"
          onclick="goBackMobile()"
        >
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <button
          id="header-home"
          class="p-1 hover:bg-white/20 rounded-full transition hidden"
          onclick="logout()"
        >
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>

        <div
          class="flex items-center gap-2 font-bold text-lg absolute left-1/2 -translate-x-1/2"
        >
          <i id="header-icon" data-lucide="car" class="w-5 h-5 hidden"></i>
          <span id="header-title">Gọi là tới</span>
        </div>

        <div class="w-6 h-6 flex items-center justify-end">
          <i
            id="header-sos"
            data-lucide="shield-alert"
            class="w-5 h-5 text-yellow-400 hidden cursor-pointer"
            onclick="alert('Đã gửi cảnh báo SOS đến Trung tâm an toàn!')"
          ></i>
        </div>
      </header>

      <main
        id="mobile-content"
        class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col bg-gray-50"
      >
        <!-- DYNAMIC CONTENT INJECTED HERE BY JS -->
      </main>

      <!-- BOTTOM NAVIGATION -->
      <nav
        id="mobile-nav"
        class="bg-white border-t border-gray-200 flex justify-around p-3 pb-safe sticky bottom-0 z-50"
      >
        <!-- DYNAMIC NAV INJECTED HERE BY JS -->
      </nav>
    </div>

    <!-- ========================================== -->
    <!-- ADMIN DESKTOP FRAME -->
    <!-- ========================================== -->
    <div
      id="admin-frame"
      class="hidden w-full h-screen bg-gray-100 flex overflow-hidden"
    >
      <!-- Sidebar -->
      <aside class="w-64 bg-gray-900 text-white flex flex-col">
        <div class="p-5 flex items-center gap-3 border-b border-gray-800">
          <div
            class="w-8 h-8 bg-red-800 rounded flex items-center justify-center"
          >
            <i data-lucide="car" class="text-white w-5 h-5"></i>
          </div>
          <span class="font-bold text-xl tracking-wide">Admin Portal</span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
          <button
            onclick="renderAdmin('dashboard')"
            id="nav-a-dashboard"
            class="w-full flex items-center gap-3 p-3 rounded-lg bg-gray-800 text-white transition"
          >
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
          </button>
          <button
            onclick="renderAdmin('users')"
            id="nav-a-users"
            class="w-full flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition"
          >
            <i data-lucide="users" class="w-5 h-5"></i> Quản lý User
          </button>
          <button
            onclick="renderAdmin('drivers')"
            id="nav-a-drivers"
            class="w-full flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition"
          >
            <i data-lucide="car" class="w-5 h-5"></i> Quản lý Driver
          </button>
          <button
            onclick="renderAdmin('rides')"
            id="nav-a-rides"
            class="w-full flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition"
          >
            <i data-lucide="map" class="w-5 h-5"></i> Quản lý Chuyến
          </button>
          <button
            onclick="renderAdmin('promotions')"
            id="nav-a-promotions"
            class="w-full flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition"
          >
            <i data-lucide="tag" class="w-5 h-5"></i> Khuyến mãi
          </button>
          <button
            onclick="renderAdmin('permissions')"
            id="nav-a-permissions"
            class="w-full flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition"
          >
            <i data-lucide="shield" class="w-5 h-5"></i> Phân quyền
          </button>
        </nav>
        <div class="p-4 border-t border-gray-800">
          <button
            onclick="logout()"
            class="w-full flex items-center gap-3 p-3 rounded-lg text-red-400 hover:bg-red-900/50 transition"
          >
            <i data-lucide="log-out" class="w-5 h-5"></i> Đăng xuất
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <header
          class="bg-white p-4 shadow-sm flex justify-between items-center z-10"
        >
          <h2 id="admin-header-title" class="text-xl font-bold text-gray-800">
            Dashboard
          </h2>
          <div class="flex items-center gap-4">
            <button class="p-2 text-gray-400 hover:text-gray-600">
              <i data-lucide="bell" class="w-5 h-5"></i>
            </button>
            <div class="flex items-center gap-2">
              <img
                src="https://i.pravatar.cc/150?img=11"
                class="w-8 h-8 rounded-full"
              />
              <span class="font-medium text-sm">Super Admin</span>
            </div>
          </div>
        </header>
        <main id="admin-content" class="flex-1 overflow-y-auto p-6 bg-gray-100">
          <!-- Injected via JS -->
        </main>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIC -->
    <!-- ========================================== -->
    <script>

      let currentApp = null; // 'customer', 'driver', 'admin'
      let navHistory = [];

        {

          plate: "30K-888.88",

        },
      ];

      const MOCK_HISTORY = [
        {
          id: 101,
          date: "15/05/2026",
          time: "14:30",
          status: "completed",
          driverName: "Nguyễn Văn A",
          driverAvatar: "https://i.pravatar.cc/150?img=11",
          plate: "30E-123.45",
          pickup: "123 Nguyễn Trãi, Thanh Xuân, Hà Nội",
          dropoff: "456 Lê Lợi, Hà Đông, Hà Nội",

          payment: "Ví MoMo",

          carType: "Ô tô 4 chỗ",
        },
        {
          id: 102,
          date: "12/05/2026",
          time: "09:15",
          status: "cancelled",
          driverName: "Trần Thị B",
          driverAvatar: "https://i.pravatar.cc/150?img=5",
          plate: "29A-678.90",
          pickup: "789 Trần Hưng Đạo, Hoàn Kiếm, Hà Nội",
          dropoff: "Khu công nghệ cao Hòa Lạc",
          price: 0,
          payment: "-",
          distance: "-",
          carType: "Ô tô 7 chỗ",
        },
        {
          id: 103,
          date: "08/05/2026",
          time: "22:00",
          status: "completed",
          driverName: "Lê Văn C",
          driverAvatar: "https://i.pravatar.cc/150?img=12",
          plate: "30F-555.55",
          pickup: "Phố đi bộ Hồ Gươm",
          dropoff: "KĐT Times City, Hai Bà Trưng, Hà Nội",
          price: 190000,
          payment: "Tiền mặt",
          distance: "5.2 km",
          carType: "Xe máy",
        },
      ];

      // --- CORE NAVIGATION ---
      window.logout = function () {
        // Đã bỏ hàm confirm() vì môi trường sandbox thường block các popup mặc định của trình duyệt
        // Ẩn tất cả frame hiện tại
        document.getElementById("mobile-frame").classList.add("hidden");
        document.getElementById("admin-frame").classList.add("hidden");
        // Hiện lại portal chọn vai trò
        document.getElementById("app-portal").classList.remove("hidden");

        // Reset state
        currentApp = null;
        navHistory = [];
        if (document.getElementById("driver-toggle"))
          document.getElementById("driver-toggle").checked = false;
        driverOnline = false;
      };

      function launchApp(appType) {
        document.getElementById("app-portal").classList.add("hidden");
        currentApp = appType;
        navHistory = [];

        if (appType === "admin") {
          document.getElementById("admin-frame").classList.remove("hidden");
          renderAdmin("dashboard");
        } else {
          document.getElementById("mobile-frame").classList.remove("hidden");
          // Customize header color based on app
          const header = document.getElementById("mobile-header");
          if (appType === "driver") {
            header.classList.remove("bg-red-800");
            header.classList.add("bg-blue-800");
            renderDriverScreen("login");
          } else {
            header.classList.add("bg-red-800");
            header.classList.remove("bg-blue-800");
            renderCustomerScreen("login");
          }
        }
      }

      function setMobileHeader(title, showBack = false, showSOS = false) {
        document.getElementById("header-title").innerText = title;
        document.getElementById("header-back").style.display = showBack
          ? "block"
          : "none";
        document.getElementById("header-home").style.display = showBack
          ? "none"
          : "block";
        document.getElementById("header-sos").style.display = showSOS
          ? "block"
          : "none";
      }

      function goBackMobile() {
        if (navHistory.length > 1) {
          navHistory.pop(); // remove current
          const prev = navHistory.pop(); // get previous
          if (currentApp === "customer")
            renderCustomerScreen(prev.screen, prev.data, false);
          else if (currentApp === "driver")
            renderDriverScreen(prev.screen, prev.data, false);
        }
      }

      function setMobileNav(activeTab, tabs) {
        const nav = document.getElementById("mobile-nav");
        if (!tabs) {
          nav.classList.add("hidden");
          return;
        }
        nav.classList.remove("hidden");
        const colorClass =
          currentApp === "driver" ? "text-blue-600" : "text-red-800";
        const hoverClass =
          currentApp === "driver"
            ? "hover:text-blue-500"
            : "hover:text-red-600";

        nav.innerHTML = tabs
          .map(
            (tab) => `
                <button onclick="${currentApp === "customer" ? `renderCustomerScreen('${tab.id}')` : `renderDriverScreen('${tab.id}')`}" 
                        class="flex flex-col items-center p-2 rounded-xl transition ${activeTab === tab.id ? `${colorClass} font-bold` : `text-gray-400 ${hoverClass}`}">
                    <i data-lucide="${tab.icon}" class="w-6 h-6"></i>
                    <span class="text-[10px] mt-1">${tab.label}</span>
                </button>
            `,
          )
          .join("");
        lucide.createIcons();
      }

      // ==========================================
      // CUSTOMER APP LOGIC
      // ==========================================
      const CUSTOMER_TABS = [
        { id: "home", icon: "home", label: "Home" },
        { id: "booking", icon: "car", label: "Đặt xe" },
        { id: "history", icon: "history", label: "Lịch sử" },
        { id: "account", icon: "user", label: "Tài khoản" },
      ];

      let customerState = {
        bookingStep: 1,
        voucher: null,
        carType: "sedan",
        rating: 0,
      };

      window.setCarType = function (type) {
        customerState.carType = type;
        renderCustomerScreen("booking", null, false); // Re-render without pushing history
      };

      window.setRating = function (val) {
        customerState.rating = val;
        const container = document.getElementById("star-rating-container");
        if (container) {
          container.innerHTML = [1, 2, 3, 4, 5]
            .map(
              (i) => `
                    <i onclick="setRating(${i})" data-lucide="star" class="w-10 h-10 cursor-pointer transition ${customerState.rating >= i ? "text-yellow-400 fill-yellow-400" : "text-gray-300 hover:text-yellow-400"}"></i>
                `,
            )
            .join("");
          lucide.createIcons();
        }
      };

      function renderCustomerScreen(screen, data = null, pushHistory = true) {
        if (pushHistory) navHistory.push({ screen, data });
        const content = document.getElementById("mobile-content");
        let html = "";

        switch (screen) {
          case "login":
            setMobileHeader("Khách hàng", false);
            setMobileNav(null);
            html = `
                        <div class="flex-1 flex flex-col p-6 bg-white justify-center h-full">
                            <h1 class="text-3xl font-bold text-red-800 mb-2">Đăng nhập</h1>
                            <p class="text-gray-500 mb-8">Xin chào khách hàng!</p>
                            <input type="text" placeholder="Số điện thoại" class="w-full p-4 border border-gray-300 rounded-xl mb-4 focus:outline-none focus:border-red-800" />
                            <input type="password" placeholder="Mật khẩu" class="w-full p-4 border border-gray-300 rounded-xl mb-2 focus:outline-none focus:border-red-800" />
                            <div class="flex justify-end mb-6">
                                <button onclick="renderCustomerScreen('forgot_pwd')" class="text-sm text-red-800 font-medium">Quên mật khẩu?</button>
                            </div>
                            <button onclick="renderCustomerScreen('home')" class="w-full bg-red-800 text-white p-4 rounded-xl font-bold text-lg mb-4">Đăng nhập</button>
                            <button class="w-full bg-white border border-red-800 text-red-800 p-4 rounded-xl font-bold text-lg">Đăng ký tài khoản</button>
                        </div>
                    `;
            break;

          case "forgot_pwd":
            setMobileHeader("Quên mật khẩu", true);
            setMobileNav(null);
            html = `
                        <div class="p-6 bg-white h-full">
                            <p class="text-gray-500 mb-6">Nhập số điện thoại để nhận mã OTP khôi phục mật khẩu.</p>
                            <input type="text" placeholder="Số điện thoại" class="w-full p-4 border border-gray-300 rounded-xl mb-6" />
                            <button onclick="alert('Đã gửi OTP!'); goBackMobile();" class="w-full bg-red-800 text-white p-4 rounded-xl font-bold text-lg">Nhận mã OTP</button>
                        </div>
                    `;
            break;

          case "home":
            setMobileHeader("Gọi là tới", false);
            setMobileNav("home", CUSTOMER_TABS);
            html = `
                        <div class="flex-1 relative bg-gray-200 overflow-hidden h-full">
                            <div class="absolute inset-0 opacity-20 bg-map-pattern"></div>
                            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
                                <div class="w-4 h-4 bg-red-800 rounded-full border-2 border-white z-10 shadow-md"></div>
                                <div class="bg-white text-xs px-2 py-1 rounded shadow mt-2 font-semibold">Vị trí của bạn</div>
                            </div>
                            <div class="absolute bottom-0 left-0 right-0 p-4 pb-6 bg-white rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
                                <h2 class="text-xl font-bold mb-4">Bạn muốn đi đâu?</h2>
                                <button onclick="renderCustomerScreen('booking')" class="w-full bg-red-800 text-white p-4 rounded-full font-bold flex justify-center gap-2">
                                    <i data-lucide="car"></i> Tìm tài xế
                                </button>
                            </div>
                        </div>
                    `;
            break;

          case "booking":
            setMobileHeader("Đặt xe", true);
            setMobileNav("booking", CUSTOMER_TABS);
            html = `
                        <div class="p-4 flex-1 overflow-y-auto bg-white h-full flex flex-col">
                            <div class="space-y-4 mb-4">
